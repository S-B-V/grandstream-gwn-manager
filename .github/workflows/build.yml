name: Build and runtime validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed upstream SHA-256
        id: checksum
        shell: bash
        run: |
          value="$(grep -Ev '^#|^[[:space:]]*$' SHA256SUM | head -n 1)"
          if ! [[ "$value" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo 'A reviewed 64-character GWN archive SHA-256 is required.' >&2
            exit 1
          fi
          echo "sha256=$value" >> "$GITHUB_OUTPUT"
      - name: Shell syntax checks
        run: bash -n scripts/entrypoint.sh scripts/healthcheck.sh scripts/ci-runtime-test.sh
      - name: Build image using official vendor installer
        run: |
          docker build --progress=plain -f Containerfile \
            --build-arg GWN_VERSION="$(cat VERSION)" \
            --build-arg GWN_SHA256="${{ steps.checksum.outputs.sha256 }}" \
            -t gwn-manager:installer-test .
      - name: Check pristine filesystem tree
        run: |
          docker run --rm --entrypoint /bin/bash gwn-manager:installer-test -euc '
            test -x /gwn/gwn
            test -d /opt/gwn-defaults/data/mysql/data
            test -f /opt/gwn-defaults/conf/gwn.conf
            test -x /usr/local/bin/healthcheck
            test -x /usr/local/bin/entrypoint
          '
      - name: Test runtime lifecycle and volume recreation
        timeout-minutes: 20
        run: bash scripts/ci-runtime-test.sh gwn-manager:installer-test
      # Intentionally NO registry login, push, artifact containing vendor files,
      # config archive upload, or environment dump. Publishing requires
      # redistribution authorization and a review of bundled credentials.
