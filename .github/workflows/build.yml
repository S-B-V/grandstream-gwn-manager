name: Validate vendor installation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Require reviewed upstream SHA-256
        id: checksum
        shell: bash
        run: |
          value="$(grep -Ev '^#|^[[:space:]]*$' SHA256SUM | head -n 1)"
          if ! [[ "$value" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo 'A reviewed 64-character GWN archive SHA-256 is required.' >&2
            exit 1
          fi
          echo "sha256=$value" >> "$GITHUB_OUTPUT"
      - name: Run official vendor installer in Docker build
        run: |
          docker build --progress=plain -f Containerfile \
            --build-arg GWN_VERSION="$(cat VERSION)" \
            --build-arg GWN_SHA256="${{ steps.checksum.outputs.sha256 }}" \
            -t gwn-manager:installer-test .
      - name: Check installed executable exists
        run: docker run --rm --entrypoint /bin/bash gwn-manager:installer-test -c 'test -x /gwn/gwn'
      # No GHCR push until lifecycle, data persistence and actual HTTP smoke tests pass.
