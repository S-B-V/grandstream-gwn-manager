name: Prepare upstream release PR
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: prepare-gwn-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      # Privileged workflow: only trusted base-branch code is executed.
      # PR files are fetched through the API and treated strictly as data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Complete version and checksum update, then trigger PR tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GWN_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/prepare-release-pr.py
