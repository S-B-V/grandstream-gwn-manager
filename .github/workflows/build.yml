name: Build, test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gwn-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate pinned release and automation
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync-release.py --check
          python3 -m unittest discover -s tests -v
          python3 - <<'PY'
          import json, os
          lock = json.load(open('upstream.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + lock['version'] + '\n')
              output.write('sha256=' + lock['digest'][7:] + '\n')
          PY
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -maxdepth 1 -type f -name '*.sh' -print0)
      - name: Build pinned official installer image
        run: |
          docker build --progress=plain -f Containerfile \
            --build-arg GWN_VERSION="${{ steps.metadata.outputs.version }}" \
            --build-arg GWN_SHA256="${{ steps.metadata.outputs.sha256 }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ steps.metadata.outputs.version }}" \
            -t gwn-manager:tested .
      - name: Check pristine filesystem tree
        run: |
          docker run --rm --entrypoint /bin/bash gwn-manager:tested -euc '
            test -x /gwn/gwn
            test ! -e /opt/gwn-defaults/data/mysql
            test -d /opt/gwn-defaults/data/mysql_default/data
            test -s /opt/gwn-defaults/conf/gwn.conf
            test -s /opt/gwn-defaults/conf/gwn/local_env.cfg
            for tool in healthcheck entrypoint configure-public-url pki-bootstrap gwn-java-memory; do
              test -x "/usr/local/bin/$tool"
            done
          '
      - name: Audit embedded key material
        env:
          ENGINE: docker
        run: bash scripts/audit-image.sh gwn-manager:tested
      - name: Runtime, memory limit, restart and volume persistence tests
        timeout-minutes: 20
        run: bash scripts/ci-runtime-test.sh gwn-manager:tested
      - name: Login to GHCR after successful tests
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPO: ${{ github.repository }}
          GWN_VERSION: ${{ steps.metadata.outputs.version }}
        run: bash scripts/publish-image.sh gwn-manager:tested
