# EXPERIMENTAL. Do not apply until image is built, audited, and clean-bootstrap tested.
apiVersion: v1
kind: Namespace
metadata:
  name: gwn-manager
---
apiVersion: v1
kind: Service
metadata:
  name: gwn-manager
  namespace: gwn-manager
spec:
  selector:
    app: gwn-manager
  type: ClusterIP
  ports:
    - {name: https, port: 8443, targetPort: 8443, protocol: TCP}
    - {name: device-tcp, port: 10014, targetPort: 10014, protocol: TCP}
    - {name: device-http, port: 8000, targetPort: 8000, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: gwn-manager-headless
  namespace: gwn-manager
spec:
  clusterIP: None
  selector: {app: gwn-manager}
  ports:
    - {name: https, port: 8443, targetPort: 8443}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gwn-manager
  namespace: gwn-manager
spec:
  serviceName: gwn-manager-headless
  replicas: 1
  updateStrategy: {type: OnDelete}
  selector:
    matchLabels: {app: gwn-manager}
  template:
    metadata:
      labels: {app: gwn-manager}
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-pvcs-and-pki
          image: ghcr.io/s-b-v/grandstream-gwn-manager:1.1.39.8
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -euo, pipefail, -c]
          args:
            - |
              shopt -s nullglob dotglob
              data=(/gwn/data/*); conf=(/gwn/conf/*)
              if (( ${#data[@]} == 0 && ${#conf[@]} == 0 )); then
                echo 'Initializing fresh volumes'
                cp -a /opt/gwn-defaults/data/. /gwn/data/
                cp -a /opt/gwn-defaults/conf/. /gwn/conf/
                /usr/local/bin/pki-bootstrap --fresh
                chown -R 1000:1000 /gwn/data /gwn/conf
              elif [[ -e /gwn/data/.pki-bootstrap-complete && -s /gwn/conf/gwn.conf ]]; then
                echo 'Existing initialized volumes, no changes'
              else
                echo 'Partial initialization detected; refusing to overwrite persistent data' >&2
                exit 1
              fi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /gwn/data}
            - {name: conf, mountPath: /gwn/conf}
      containers:
        - name: gwn-manager
          image: ghcr.io/s-b-v/grandstream-gwn-manager:1.1.39.8
          imagePullPolicy: IfNotPresent
          ports:
            - {name: https, containerPort: 8443, protocol: TCP}
            - {name: device-tcp, containerPort: 10014, protocol: TCP}
            - {name: device-http, containerPort: 8000, protocol: TCP}
          startupProbe:
            exec: {command: [/usr/local/bin/healthcheck]}
            periodSeconds: 10
            failureThreshold: 40
            timeoutSeconds: 10
          readinessProbe:
            exec: {command: [/usr/local/bin/healthcheck]}
            periodSeconds: 15
            failureThreshold: 2
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: [/usr/local/bin/healthcheck]}
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {memory: 4Gi}
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: data, mountPath: /gwn/data}
            - {name: conf, mountPath: /gwn/conf}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 10Gi}
    - metadata: {name: conf}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
