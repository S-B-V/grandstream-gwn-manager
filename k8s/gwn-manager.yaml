apiVersion: v1
kind: Namespace
metadata:
  name: gwn-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gwn-java-memory
  namespace: gwn-manager
data:
  java-memory-limited: |
    #!/bin/bash
    # Match the vendor's 4 GiB host profile even when /proc/meminfo shows VM RAM.
    # Four JVM heaps share the limit with native memory, Node, and MariaDB.
    set -euo pipefail
    args=()
    for arg in "$@"; do
      case "$arg" in
        -Xmx*|-Xms*) ;;
        *) args+=("$arg") ;;
      esac
    done
    exec /gwn/bin/jre/bin/java -Xms64m -Xmx512m "${args[@]}"
---
apiVersion: v1
kind: Service
metadata:
  name: gwn-manager
  namespace: gwn-manager
spec:
  type: ClusterIP
  selector:
    app: gwn-manager
  ports:
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
    - name: device-tcp
      port: 10014
      targetPort: device-tcp
      protocol: TCP
    - name: device-http
      port: 8000
      targetPort: device-http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: gwn-manager-headless
  namespace: gwn-manager
spec:
  clusterIP: None
  selector:
    app: gwn-manager
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gwn-manager
  namespace: gwn-manager
spec:
  serviceName: gwn-manager-headless
  replicas: 1
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: gwn-manager
  template:
    metadata:
      labels:
        app: gwn-manager
    spec:
      terminationGracePeriodSeconds: 90
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: initialize-pvcs-and-pki
          image: ghcr.io/s-b-v/grandstream-gwn-manager:1.1.39.8
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -euo, pipefail, -c]
          env:
            # Locally verified settings; adapt before external exposure.
            - name: GWN_ACCESS_ADDRESS
              value: "127.0.0.1"
            - name: GWN_PUBLIC_HOST
              value: "localhost"
            - name: GWN_PUBLIC_HTTPS_PORT
              value: "18447"
          args:
            - |
              trap 'rc=$?; echo "BOOTSTRAP FAILED: line ${LINENO}, exit ${rc}" >&2' ERR
              shopt -s nullglob dotglob
              echo "STEP 1: Check PVC state"
              data=(/gwn/data/*)
              conf=(/gwn/conf/*)
              if (( ${#data[@]} == 0 && ${#conf[@]} == 0 )); then
                echo 'Initializing fresh GWN Manager volumes'
                echo 'STEP 2: Verify image defaults'
                test ! -e /opt/gwn-defaults/data/mysql
                test -d /opt/gwn-defaults/data/mysql_default/data
                echo 'STEP 3: Copy data defaults'
                cp -av /opt/gwn-defaults/data/. /gwn/data/ > /dev/null
                echo 'STEP 3: Data defaults copied'
                echo 'STEP 4: Copy configuration defaults'
                cp -av /opt/gwn-defaults/conf/. /gwn/conf/ > /dev/null
                echo 'STEP 4: Configuration defaults copied'
                test ! -e /gwn/data/mysql
                echo 'STEP 5: Initialize active MariaDB'
                cp -a /gwn/data/mysql_default /gwn/data/mysql
                echo 'STEP 6: Configure public URL'
                /usr/local/bin/configure-public-url
                echo 'STEP 7: Generate PKI'
                /usr/local/bin/pki-bootstrap --fresh
                echo 'STEP 8: Set volume ownership'
                chown -R 1000:1000 /gwn/data /gwn/conf
                echo 'STEP 9: Verify initialized volumes'
                test -d /gwn/data/mysql/data
                test -s /gwn/conf/gwn.conf
                test -s /gwn/conf/nginx/ssl.pem
                test -e /gwn/data/.pki-bootstrap-complete
                echo 'Fresh bootstrap completed'
              elif [[ -e /gwn/data/.pki-bootstrap-complete &&
                      -d /gwn/data/mysql/data &&
                      -s /gwn/conf/gwn.conf &&
                      -s /gwn/conf/gwn/local_env.cfg &&
                      -s /gwn/conf/nginx/ssl.pem ]]; then
                echo 'Existing initialized volumes; preserving data and certificates'
              else
                echo 'Partial initialization detected; refusing to overwrite persistent data' >&2
                echo 'DATA entries:' >&2; find /gwn/data -mindepth 1 -maxdepth 1 -printf '%f\n' >&2
                echo 'CONF entries:' >&2; find /gwn/conf -mindepth 1 -maxdepth 1 -printf '%f\n' >&2
                exit 1
              fi

              # Apply to both fresh and existing initialized configuration PVCs.
              # Login-shell service launchers discard container JVM environment
              # variables, so use the vendor's java_bin setting instead.
              echo 'Configure Java memory budget for the 4 GiB container'
              grep -q '^java_bin=' /gwn/conf/gwn.conf
              if ! grep -qx 'java_bin=/gwn/conf/java-memory-limited' /gwn/conf/gwn.conf; then
                if [[ ! -e /gwn/conf/gwn.conf.before-memory-profile ]]; then
                  cp -p /gwn/conf/gwn.conf /gwn/conf/gwn.conf.before-memory-profile
                  chmod 600 /gwn/conf/gwn.conf.before-memory-profile
                fi
              fi
              install -o 1000 -g 1000 -m 0755 \
                /opt/gwn-memory/java-memory-limited /gwn/conf/java-memory-limited
              sed -i 's|^java_bin=.*|java_bin=/gwn/conf/java-memory-limited|' /gwn/conf/gwn.conf
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            # Retain default runtime capabilities for cp -a and chown.
            # In particular, CAP_CHOWN is required to preserve vendor file ownership.
          volumeMounts:
            - name: data
              mountPath: /gwn/data
            - name: conf
              mountPath: /gwn/conf
            - name: java-memory
              mountPath: /opt/gwn-memory
              readOnly: true
      containers:
        - name: gwn-manager
          image: ghcr.io/s-b-v/grandstream-gwn-manager:1.1.39.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: device-tcp
              containerPort: 10014
              protocol: TCP
            - name: device-http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            exec:
              command: [/usr/local/bin/healthcheck]
            periodSeconds: 10
            failureThreshold: 40
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: [/usr/local/bin/healthcheck]
            periodSeconds: 15
            failureThreshold: 2
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [/usr/local/bin/healthcheck]
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              # Total container budget, including all four JVMs and other services.
              memory: 4Gi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /gwn/data
            - name: conf
              mountPath: /gwn/conf
      volumes:
        - name: java-memory
          configMap:
            name: gwn-java-memory
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: conf
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
