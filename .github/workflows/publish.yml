name: Publish GHCR (manual, gated)

on:
  workflow_dispatch:
    inputs:
      redistribution_authorized:
        description: 'I have verified Grandstream redistribution rights for this image'
        required: true
        type: boolean
        default: false
      security_review_completed:
        description: 'I reviewed all bundled vendor credentials/secrets, not just the automated scan'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gwn-ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.redistribution_authorized && inputs.security_review_completed
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    # Create this protected environment in repository Settings first.
    environment: ghcr-publish
    steps:
      - uses: actions/checkout@v5
      - name: Validate version and reviewed checksum
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(grep -Ec '^[a-fA-F0-9]{64}$' SHA256SUM)" == 1 ]]
          sha="$(cat SHA256SUM)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Build official installer image
        run: |
          docker build --progress=plain -f Containerfile \
            --build-arg GWN_VERSION="${{ steps.metadata.outputs.version }}" \
            --build-arg GWN_SHA256="${{ steps.metadata.outputs.sha256 }}" \
            -t gwn-manager:publish-candidate .
      - name: Audit embedded key material (fail closed)
        env:
          ENGINE: docker
        run: bash scripts/audit-image.sh gwn-manager:publish-candidate
      - name: Runtime, restart and volume persistence tests
        timeout-minutes: 20
        run: bash scripts/ci-runtime-test.sh gwn-manager:publish-candidate
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect image manifest
        run: |
          docker image inspect gwn-manager:publish-candidate \
            --format 'Architecture={{.Architecture}} OS={{.Os}}'
          docker version
      - name: Push immutable version tag
        shell: bash
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${REPO,,}"
          # Never update an existing release tag; inspect first.
          if docker manifest inspect "$repo:$VERSION" >/dev/null 2>&1; then
            echo "Refusing to replace existing image tag $VERSION" >&2
            exit 1
          fi
          docker tag gwn-manager:publish-candidate "$repo:$VERSION"
          docker --debug push "$repo:$VERSION"
          echo "Published: $repo:$VERSION" >> "$GITHUB_STEP_SUMMARY"
