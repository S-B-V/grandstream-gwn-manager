name: Check vendor releases
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/check-release.py
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: detect Grandstream GWN Manager update'
          title: 'chore: update GWN Manager upstream version (review required)'
          body: 'Verify official upstream release, SHA-256, installation behavior and licensing before merging. The container is not runtime-ready.'
          branch: automation/gwn-upstream-update
          delete-branch: true
          labels: dependencies
