apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gwn-manager-redirect
  namespace: gwn-manager
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gwn-example-gateway
    namespace: gwn-manager
    sectionName: http
  hostnames:
  - gwn-ui.localhost.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
