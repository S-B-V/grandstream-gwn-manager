apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gwn-manager
  namespace: gwn-manager
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gwn-example-gateway
    sectionName: https
    namespace: gwn-manager
  hostnames:
  - gwn-ui.localhost.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gwn-manager-web
      port: 8443
