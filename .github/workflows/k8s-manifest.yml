name: Validate Kubernetes manifest
on:
  push:
    paths:
      - 'k8s/**'
      - '.github/workflows/k8s-manifest.yml'
  pull_request:
    paths:
      - 'k8s/**'
      - '.github/workflows/k8s-manifest.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Kubernetes objects (client-side)
        run: |
          curl -fsSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary k8s/gwn-manager.yaml
